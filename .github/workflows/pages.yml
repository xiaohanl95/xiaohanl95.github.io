name: Initialize and publish website
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Expand website source
        if: hashFiles('website-source.zip') != ''
        run: |
          echo "8d423ebb7b0d8b54f6f5a0387f25ff17af76fcdc3953315b442d97a77367d82d  website-source.zip" | sha256sum --check
          unzip -o website-source.zip
          rm website-source.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Import academic website source and assets"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: pnpm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
